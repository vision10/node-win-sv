name: Publish

# Publishes to npm when a GitHub release is published.
# The release tag has to be the package.json version, with or without a leading "v" (v1.0.0).
# Needs a repository secret named NPM_TOKEN: an npm automation or granular access token allowed to publish win-sv.

on:
  release:
    types: [published]

permissions:
  contents: read
  # lets npm attach a provenance statement linking the package to this repository and run
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check that the tag matches package.json
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version $version"
            exit 1
          fi

      - name: Unit tests
        run: npm test

      - name: Acceptance tests
        run: npm run test:acceptance

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
